[package]
name = "math-catch-game"
version = "0.5.0"
edition = "2021"
description = "A fun and educational math game built with Rust and WebAssembly"
repository = "https://github.com/your-username/math-catch-game"
license = "MIT"
authors = ["Math Game Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Element",
    "EventTarget",
    "MouseEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "Performance",
    "PointerEvent",
] }
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
